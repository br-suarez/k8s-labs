apiVersion: v1
kind: Service
metadata:
  name: slo-demo
  namespace: slo-demo
  labels:
    app: slo-demo
spec:
  # NodePort 30080 is mapped to the host in cluster/kind-config.yaml, so the
  # load generator can drive traffic from outside the cluster without holding
  # a kubectl port-forward open for the whole lab.
  type: NodePort
  selector:
    app: slo-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
