# Cluster profile: standard — modules 07-13. Approx 4 GiB.
# Two workers so scheduling, anti-affinity and PDBs have somewhere to land.
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: pulse
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
