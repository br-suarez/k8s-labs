# Cluster profile: ha — module 06 HA lab ONLY. Approx 6 GiB.
# Three control-plane nodes give a real etcd quorum, so losing one is survivable
# and losing two is not. Tear this down as soon as the lab is finished.
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: pulse-ha
nodes:
  - role: control-plane
  - role: control-plane
  - role: control-plane
  - role: worker
  - role: worker
