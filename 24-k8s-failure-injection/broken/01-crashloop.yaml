# FAULT 1 — CrashLoopBackOff
#
# nginx is handed a config file with a typo'd directive. The container starts,
# nginx parses the config, fails, and exits. Kubernetes restarts it, it fails
# again, and the backoff grows: 10s, 20s, 40s...
#
# What makes this worth practising: by the time anyone looks, the container that
# produced the error is already gone. `kubectl logs` returns the logs of the
# CURRENT attempt, which may still be starting up — the useful output belongs to
# the previous, dead container.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: k8s-refresher
data:
  nginx.conf: |
    # "worker_procesess" is a typo for "worker_processes".
    # nginx refuses to start on an unknown directive rather than ignoring it.
    worker_procesess auto;
    events {
      worker_connections 1024;
    }
    http {
      server {
        listen 80;
        location / {
          return 200 'ok\n';
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-crashloop
  namespace: k8s-refresher
  labels:
    app: web-crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-crashloop
  template:
    metadata:
      labels:
        app: web-crashloop
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              memory: 48Mi
      volumes:
        - name: config
          configMap:
            name: nginx-config
