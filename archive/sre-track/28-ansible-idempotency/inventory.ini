# Targets are Docker containers, reached with the community.docker connection
# plugin — it uses `docker exec` rather than SSH, so no sshd, no keys, and no
# port forwarding. The playbooks are identical to what would run against a VM;
# only this file changes.
[webservers]
web01
web02

[webservers:vars]
ansible_connection=community.docker.docker
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
