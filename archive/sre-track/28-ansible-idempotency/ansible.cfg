[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
# If cowsay is installed, Ansible pipes every section header through it and the
# output becomes unreadable ASCII cows. Off.
nocows = True
# Human-readable output: the default `default` callback prints a JSON blob per
# task, which makes it much harder to see the thing this lab is about — the
# ok/changed counts.
stdout_callback = yaml
# Deprecation noise from the docker connection plugin drowns the actual output.
deprecation_warnings = False

[privilege_escalation]
# The lab targets containers whose entrypoint already runs as root, so there is
# nothing to escalate to. Left explicit so the difference from a real VM
# inventory (which would need become=True) is visible rather than assumed.
become = False
