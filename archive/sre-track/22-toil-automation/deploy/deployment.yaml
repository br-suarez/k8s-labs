apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-runner
  namespace: monitoring
  labels:
    app: triage-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-runner
  template:
    metadata:
      labels:
        app: triage-runner
    spec:
      serviceAccountName: triage-runner
      containers:
        - name: receiver
          image: triage-runner:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: PROM_URL
              value: http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090
            - name: REPORT_DIR
              value: /reports
          volumeMounts:
            - name: reports
              mountPath: /reports
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        # emptyDir is enough: reports are also printed to stdout, so the
        # durable copy is whatever collects container logs.
        - name: reports
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: triage-runner
  namespace: monitoring
  labels:
    app: triage-runner
spec:
  selector:
    app: triage-runner
  ports:
    - name: http
      port: 9000
      targetPort: http
