# Deployed into both cicd-staging and cicd-production with `kubectl apply -n`.
# One manifest, two environments — the promoted artifact is the same image, and
# the only difference between environments is which namespace it lands in.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    app: checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: slo-demo:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  labels:
    app: checkout
spec:
  selector:
    app: checkout
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: checkout
  labels:
    app: checkout
spec:
  selector:
    matchLabels:
      app: checkout
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
# The gate cannot verify a release that receives no traffic, so staging
# generates its own. In a real pipeline this is a load test or synthetic
# monitoring — the principle is the same: a release with no requests has not
# been proven to work, it has only been proven to start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app: loadgen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                curl -s -Z --parallel-max 8 --max-time 10 \
                  "http://checkout:8080/api?i=[1-100]" > /dev/null 2>&1 || true
              done
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              memory: 32Mi
